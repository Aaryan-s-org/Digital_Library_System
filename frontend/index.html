<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Library Portal - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 450px;
      width: 100%;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
    }

    .login-header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .login-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .login-form {
      padding: 40px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.1);
    }

    .form-group input::placeholder {
      color: #999;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .login-footer {
      text-align: center;
      padding: 20px 40px;
      border-top: 1px solid #e0e0e0;
      color: #666;
      font-size: 12px;
    }

    .demo-credentials {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }

    .demo-credentials strong {
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    .demo-item {
      margin-bottom: 8px;
      padding: 5px;
      background: white;
      border-radius: 4px;
    }

    .role-badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 5px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-container {
        margin: 20px;
      }

      .login-header {
        padding: 30px 15px;
      }

      .login-header h1 {
        font-size: 22px;
      }

      .login-form {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">📚</div>
      <h1>Digital Library Portal</h1>
      <p>Secure Access to Digital Books</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter your username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

      <div class="message" id="message"></div>

      <div class="demo-credentials">
        <strong>Demo Credentials:</strong>
        <div class="demo-item">
          Admin: admin / admin123
          <span class="role-badge">Admin</span>
        </div>
        <div class="demo-item">
          Librarian: librarian / lib123
          <span class="role-badge">Librarian</span>
        </div>
        <div class="demo-item">
          Member: member / mem123
          <span class="role-badge">Member</span>
        </div>
      </div>
    </form>

    <div class="login-footer">
      © 2026 Marathwada Mitra Mandal College of Engineering. All rights reserved.
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      loginBtn.classList.add('loading');
      loginBtn.textContent = 'Signing in...';
      messageDiv.className = 'message';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          messageDiv.className = 'message success';
          messageDiv.textContent = 'Login successful! Redirecting...';
          
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1500);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = data.message || 'Login failed';
        }
      } catch (error) {
        console.error('Login error:', error);
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Server error. Please try again.';
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
