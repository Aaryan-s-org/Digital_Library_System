<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lumina Library Librarian Dashboard" />
    <title>Lumina Library — Librarian Dashboard</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="librarian">
    <div id="app" class="app-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="sidebar__brand">
          <a class="brand" href="index.html" aria-label="Digital Library home">
            <span class="brand__mark" aria-hidden="true">L</span>
            <span class="brand__name">Lumina Library</span>
          </a>
        </div>

        <nav class="sidebar__nav" aria-label="Library sections">
          <ul class="nav-list">
            <li class="nav-list__item"><a class="nav-link" href="#" aria-current="page">Dashboard</a></li>
            <li class="nav-list__item"><a class="nav-link" href="#">E-Books</a></li>
            <li class="nav-list__item"><a class="nav-link" href="#">Members</a></li>
            <li class="nav-list__item"><a class="nav-link" href="#">Catalog</a></li>
            <li class="nav-list__item"><a class="nav-link" href="#">Notifications</a></li>
          </ul>

          <p class="section-heading__eyebrow" style="margin-top: 2rem; margin-bottom: 0.5rem;">Navigate</p>
          <ul class="nav-list">
            <li class="nav-list__item"><a class="nav-link" href="index.html">Public Home</a></li>
          </ul>
        </nav>

        <section class="sidebar__profile" aria-label="User profile">
          <div class="user-summary">
            <span class="user-summary__avatar" aria-hidden="true">L</span>
            <div class="user-summary__details">
              <p class="user-summary__name">Librarian</p>
              <p class="user-summary__meta">Staff</p>
            </div>
          </div>
          <button class="text-button" style="margin-top: var(--space-sm); width: 100%; font-size: var(--font-size-sm);" data-action="logout">Sign Out</button>
        </section>
      </aside>

      <!-- MAIN FRAME -->
      <div class="page-frame">
        <!-- TOP BAR -->
        <header class="top-bar">
          <div class="top-bar__intro">
            <p class="top-bar__eyebrow">Librarian Workspace</p>
            <h1 class="top-bar__title">Catalog Overview</h1>
          </div>
          <div class="top-bar__actions" aria-label="Account controls">
            <button class="text-button" type="button">Notifications</button>
            <button class="profile-control" type="button">
              <span class="profile-control__avatar" aria-hidden="true">L</span>
              <span class="profile-control__label">Librarian</span>
            </button>
          </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="main-content">
          
          <!-- LIBRARY OVERVIEW STATS -->
          <section class="content-section" aria-labelledby="overview-title">
            <div class="section-heading">
              <h2 class="section-heading__title" id="overview-title">Library Overview</h2>
            </div>
            <div class="grid-dashboard-stats" id="librarian-stats">
              <div style="grid-column: 1 / -1; text-align: center; padding: var(--space-xl);"><div class="spinner"></div></div>
            </div>
          </section>

          <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-xl);">
            
            <div style="display: flex; flex-direction: column; gap: var(--space-2xl);">
              
              <!-- EBOOKS TABLE -->
              <section class="content-section" aria-labelledby="recent-books-title">
                <div class="section-heading">
                  <h2 class="section-heading__title" id="recent-books-title">E-Book Catalog</h2>
                </div>
                <div class="data-table-wrapper" id="librarian-books-table">
                  <div style="text-align: center; padding: var(--space-xl);"><div class="spinner"></div></div>
                </div>
              </section>

              <!-- RECENT ACTIVITY -->
              <section class="content-section" aria-labelledby="member-activity-title">
                <div class="section-heading">
                  <h2 class="section-heading__title" id="member-activity-title">Recent Activity</h2>
                </div>
                <div id="librarian-activity">
                  <div style="text-align: center; padding: var(--space-xl);"><div class="spinner"></div></div>
                </div>
              </section>
              
            </div>

            <!-- QUICK ACTIONS -->
            <section class="content-section" aria-labelledby="actions-title">
              <div class="section-heading">
                <h2 class="section-heading__title" id="actions-title">Quick Actions</h2>
              </div>
              
              <div style="display: flex; flex-direction: column; gap: var(--space-md);">
                <button class="card" style="text-align: left; background: var(--color-surface); cursor: pointer; display: flex; align-items: center; gap: var(--space-sm);" id="btn-gen-lib-report">
                  <span style="display: grid; place-items: center; width: 2rem; height: 2rem; background: var(--color-sage-100); color: var(--color-sage-700); border-radius: 50%; font-weight: bold;">R</span>
                  <strong>Generate Report</strong>
                </button>
                <a href="index.html" class="card" style="text-align: left; background: var(--color-surface); cursor: pointer; display: flex; align-items: center; gap: var(--space-sm); text-decoration: none; color: inherit;">
                  <span style="display: grid; place-items: center; width: 2rem; height: 2rem; background: var(--color-lavender-100); color: var(--color-lavender-700); border-radius: 50%; font-weight: bold;">B</span>
                  <strong>Browse E-Books</strong>
                </a>
              </div>
            </section>
            
          </div>

        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js" defer></script>
    <script>
      document.getElementById('btn-gen-lib-report')?.addEventListener('click', async () => {
        const result = await API.generateReadingReport();
        if (result && result.success) showToast('Reading report generated!', 'success');
        else showToast('Failed to generate report', 'error');
      });
    </script>
  </body>
</html>
