<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to the Digital Library." />
    <title>Digital Library | Sign in</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <style>
      .auth-page { display: grid; min-height: 100vh; place-items: center; padding: var(--gutter); }
      .auth-card { width: min(100%, 28rem); padding: clamp(var(--space-6), 6vw, var(--space-10)); }
      .auth-card__heading { margin-top: var(--space-8); font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 400; letter-spacing: -0.06em; line-height: 0.98; }
      .auth-card__intro { margin-top: var(--space-4); color: var(--color-ink-soft); }
      .auth-form { display: grid; gap: var(--space-5); margin-top: var(--space-8); }
      .auth-field { display: grid; gap: var(--space-2); }
      .auth-field label { color: var(--color-charcoal); font-size: var(--text-sm); font-weight: 700; }
      .auth-submit { width: 100%; margin-top: var(--space-2); }
      .auth-error { padding: var(--space-3) var(--space-4); color: #7d3f45; background: #f8e9e8; border: 1px solid #e8c8c8; border-radius: var(--radius-sm); font-size: var(--text-sm); }
      .auth-error[hidden] { display: none; }
      .auth-back { display: inline-flex; margin-top: var(--space-6); color: var(--color-ink-soft); font-size: var(--text-sm); }
      .auth-back:hover { color: var(--color-charcoal); }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card surface--glass" aria-labelledby="login-title">
        <a class="brand" href="index.html" aria-label="Digital Library home"><span class="brand__mark" aria-hidden="true">D</span><span class="brand__name">Digital Library</span></a>
        <p class="eyebrow" style="margin-top: var(--space-10);">Library access</p>
        <h1 class="auth-card__heading" id="login-title">Welcome back.</h1>
        <p class="auth-card__intro">Sign in with your library account to continue.</p>
        <div class="demo-logins" style="margin-top: var(--space-6); padding: var(--space-4); background: rgba(0,0,0,0.03); border-radius: var(--radius-md); border: 1px solid var(--color-hairline, rgba(0,0,0,0.08));">
          <p style="font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--color-ink-soft); margin-bottom: 0.5rem;">Quick Demo Sign-in</p>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button type="button" class="chip-btn" data-demo-user="admin_sarah" data-demo-pass="AdminPassword123!" style="padding: 0.35rem 0.65rem; font-size: 0.8rem; border-radius: 999px; border: 1px solid var(--color-hairline); background: white; cursor: pointer; transition: all 0.2s ease;">Admin</button>
            <button type="button" class="chip-btn" data-demo-user="librarian_clara" data-demo-pass="LibrarianPassword123!" style="padding: 0.35rem 0.65rem; font-size: 0.8rem; border-radius: 999px; border: 1px solid var(--color-hairline); background: white; cursor: pointer; transition: all 0.2s ease;">Librarian</button>
            <button type="button" class="chip-btn" data-demo-user="aarav_mehta" data-demo-pass="MemberPassword123!" style="padding: 0.35rem 0.65rem; font-size: 0.8rem; border-radius: 999px; border: 1px solid var(--color-hairline); background: white; cursor: pointer; transition: all 0.2s ease;">Member</button>
          </div>
        </div>

        <form class="auth-form" data-login-form novalidate>
          <div class="auth-field"><label for="username">Username</label><input class="field" id="username" name="username" type="text" autocomplete="username" required /></div>
          <div class="auth-field"><label for="password">Password</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" required /></div>
          <p class="auth-error" data-login-error role="alert" hidden></p>
          <button class="button button--primary auth-submit" type="submit" data-login-submit>Sign in</button>
        </form>
        <a class="auth-back" href="index.html">← Back to discover</a>
      </section>
    </main>
    
    <footer class="site-footer"></footer>
    <script src="js/nav.js" defer></script>
    <script src="js/login.js" defer></script>
  </body>
</html>
