<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Lumina Library - Your Digital Reading Portal" />
    <title>Lumina Library — Sign In</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--gradient-archive-soft);
        padding: var(--space-lg);
      }
      .login-card {
        width: min(100%, 28rem);
        background: var(--glass-background);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: var(--glass-border);
        box-shadow: var(--shadow-lifted);
        border-radius: var(--radius-lg);
        padding: var(--space-2xl) var(--space-xl);
      }
      .login-brand {
        text-align: center;
        margin-bottom: var(--space-2xl);
      }
      .login-brand__mark {
        display: inline-grid;
        width: 3.5rem;
        height: 3.5rem;
        place-items: center;
        border-radius: 50%;
        background: var(--gradient-mint-lavender);
        border: 2px solid var(--color-border);
        font-family: var(--font-family-display);
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-text-strong);
        margin-bottom: var(--space-md);
      }
      .login-brand__name {
        display: block;
        font-family: var(--font-family-display);
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-text-strong);
      }
      .login-brand__sub {
        display: block;
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
        margin-top: var(--space-2xs);
      }
      .login-tabs {
        display: flex;
        border-bottom: 2px solid var(--color-border);
        margin-bottom: var(--space-xl);
      }
      .login-tab {
        flex: 1;
        padding: var(--space-sm) 0;
        text-align: center;
        font-weight: 600;
        color: var(--color-text-muted);
        cursor: pointer;
        border: none;
        background: none;
        font-size: var(--font-size-md);
        position: relative;
        transition: color var(--duration-fast);
      }
      .login-tab--active {
        color: var(--color-text-strong);
      }
      .login-tab--active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--color-accent);
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }
      .login-form[hidden] { display: none; }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-2xs);
      }
      .form-group label {
        font-size: var(--font-size-sm);
        font-weight: 600;
        color: var(--color-text-strong);
      }
      .form-group input {
        min-height: 2.75rem;
        padding: 0 var(--space-md);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
        background: var(--color-surface-strong);
        color: var(--color-text);
        font-size: var(--font-size-md);
        transition: border-color var(--duration-fast);
      }
      .form-group input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px var(--color-focus);
      }
      .login-submit {
        min-height: 2.75rem;
        border: none;
        border-radius: var(--radius-md);
        background: var(--color-accent);
        color: white;
        font-weight: 700;
        font-size: var(--font-size-md);
        cursor: pointer;
        transition: background-color var(--duration-fast), transform var(--duration-fast);
      }
      .login-submit:hover {
        background: var(--color-sage-600);
        transform: translateY(-1px);
      }
      .login-submit:active {
        transform: translateY(0);
      }
      .login-error {
        color: #8C2A2A;
        background: #F8E6E6;
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
        display: none;
      }
      .login-error--visible { display: block; }
      .login-footer {
        text-align: center;
        margin-top: var(--space-lg);
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .login-demo {
        margin-top: var(--space-lg);
        padding-top: var(--space-md);
        border-top: 1px solid var(--color-border);
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }
      .login-demo strong { color: var(--color-text); }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-brand">
          <span class="login-brand__mark">L</span>
          <span class="login-brand__name">Lumina Library</span>
          <span class="login-brand__sub">Your Digital Reading Portal</span>
        </div>

        <div class="login-tabs">
          <button class="login-tab login-tab--active" id="tab-login" type="button">Sign In</button>
          <button class="login-tab" id="tab-signup" type="button">Create Account</button>
        </div>

        <div id="login-error" class="login-error"></div>

        <!-- Login Form -->
        <form class="login-form" id="form-login">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" placeholder="Enter your username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
          <button class="login-submit" type="submit">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form class="login-form" id="form-signup" hidden>
          <div class="form-group">
            <label for="signup-fullname">Full Name</label>
            <input type="text" id="signup-fullname" name="fullName" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" name="username" placeholder="Choose a username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="your@email.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="Choose a password (min 6 chars)" required minlength="6" autocomplete="new-password" />
          </div>
          <button class="login-submit" type="submit">Create Account</button>
        </form>

        <div class="login-demo">
          <p><strong>Demo Accounts:</strong></p>
          <p>Admin: <code>admin</code> / <code>admin123</code></p>
          <p>Librarian: <code>librarian</code> / <code>admin123</code></p>
          <p>Member: <code>member</code> / <code>admin123</code></p>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // If already authenticated, redirect to dashboard
        if (API.isAuthenticated()) {
          window.location.href = Auth.getDashboardUrl();
          return;
        }

        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const formLogin = document.getElementById('form-login');
        const formSignup = document.getElementById('form-signup');
        const errorEl = document.getElementById('login-error');

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.classList.add('login-error--visible');
        }
        function hideError() {
          errorEl.classList.remove('login-error--visible');
        }

        // Tab switching
        tabLogin.addEventListener('click', () => {
          tabLogin.classList.add('login-tab--active');
          tabSignup.classList.remove('login-tab--active');
          formLogin.hidden = false;
          formSignup.hidden = true;
          hideError();
        });
        tabSignup.addEventListener('click', () => {
          tabSignup.classList.add('login-tab--active');
          tabLogin.classList.remove('login-tab--active');
          formSignup.hidden = false;
          formLogin.hidden = true;
          hideError();
        });

        // Login handler
        formLogin.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideError();
          const username = document.getElementById('login-username').value.trim();
          const password = document.getElementById('login-password').value;
          
          if (!username || !password) { showError('Please fill in all fields'); return; }

          const result = await API.login(username, password);
          if (result && result.success) {
            window.location.href = Auth.getDashboardUrl();
          } else {
            showError(result?.message || 'Login failed');
          }
        });

        // Signup handler
        formSignup.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideError();
          const fullName = document.getElementById('signup-fullname').value.trim();
          const username = document.getElementById('signup-username').value.trim();
          const email = document.getElementById('signup-email').value.trim();
          const password = document.getElementById('signup-password').value;

          if (!fullName || !username || !email || !password) { showError('Please fill in all fields'); return; }
          if (password.length < 6) { showError('Password must be at least 6 characters'); return; }

          const result = await API.signup(username, email, password, fullName);
          if (result && result.success) {
            window.location.href = '/member.html';
          } else {
            showError(result?.message || 'Registration failed');
          }
        });
      });
    </script>
  </body>
</html>
