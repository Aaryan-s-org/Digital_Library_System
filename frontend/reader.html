<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lumina Library EPUB Reader" />
    <title>Reading — Lumina Library</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/reader.css" />
    <!-- ePub.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  </head>
  <body>
    <!-- DRM Blur Overlay -->
    <div id="drm-blur-overlay" class="drm-blur-overlay"></div>

    <!-- Reader Container -->
    <div id="reader-container" class="reader-container">

      <!-- Reader Toolbar -->
      <header class="reader-toolbar">
        <div class="reader-toolbar__left">
          <button id="btn-back" class="reader-btn reader-btn--icon" title="Back to Library" aria-label="Back to Library">
            ← Back
          </button>
        </div>
        <div class="reader-toolbar__center">
          <h1 id="reader-book-title" class="reader-toolbar__title">Loading...</h1>
          <p id="reader-book-author" class="reader-toolbar__author"></p>
        </div>
        <div class="reader-toolbar__right">
          <button id="btn-bookmark" class="reader-btn reader-btn--icon" title="Add Bookmark" aria-label="Add Bookmark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
          <button id="btn-toggle-bookmarks" class="reader-btn reader-btn--icon" title="View Bookmarks" aria-label="View Bookmarks">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Reader Main Area -->
      <div class="reader-main">
        <!-- Previous Page -->
        <button id="btn-prev" class="reader-nav reader-nav--prev" aria-label="Previous Page">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>

        <!-- EPUB Viewport -->
        <div id="reader-viewport" class="reader-viewport">
          <p id="reader-status" class="reader-status">Initializing reader...</p>
        </div>

        <!-- Next Page -->
        <button id="btn-next" class="reader-nav reader-nav--next" aria-label="Next Page">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <!-- Progress Bar -->
      <div class="reader-progress">
        <div class="reader-progress__bar">
          <div id="reader-progress-fill" class="reader-progress__fill"></div>
        </div>
        <span id="reader-progress-text" class="reader-progress__text">0%</span>
      </div>

      <!-- Watermark -->
      <div id="reader-watermark" class="reader-watermark"></div>
    </div>

    <!-- Bookmarks Panel -->
    <aside id="bookmarks-panel" class="bookmarks-panel">
      <div class="bookmarks-panel__header">
        <h2 class="bookmarks-panel__title">Bookmarks & Notes</h2>
        <button id="btn-close-bookmarks" class="reader-btn reader-btn--icon" aria-label="Close Bookmarks">×</button>
      </div>
      <div id="bookmarks-list" class="bookmarks-list">
        <p class="bookmarks-empty">No bookmarks yet.</p>
      </div>
    </aside>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reader.js"></script>
  </body>
</html>
